# ========================================================================================
# -=TEMPLATE=- dirsyncd Configuration Header
# ========================================================================================
#
# REQUIRED FIELDS:
#   WATCH_PATH=   Must precede the valid directory path you desire to track and backup.
#   BACKUP_PATH=  Must precede the valid directory path where you wish to store backups.
#
# CRITICAL RESTRICTIONS:
#   - WATCH_PATH and BACKUP_PATH must never coincide (e.g., WATCH_PATH must not contain 
#     BACKUP_PATH and vice versa). Overlapping paths risk infinite recursive behavior 
#     and will quickly exhaust kernel resources.
#   - Do not directly edit or modify files and directories inside BACKUP_PATH.
#
# MAINTENANCE NOTE:
#   - If WATCH_PATH itself is renamed or moved, the configuration path must be updated 
#     followed by a clean restart of the dirsyncd daemon.
#
#
# An example template below has been provided.
#
# ========================================================================================

WATCH_PATH=
BACKUP_PATH=

# ==============================================================================
# Blacklisted Patterns (Files/Directories to ignore)
# ==============================================================================

# Ignore all hidden files / directories (Includes git files)
.*

# Ignore temporary files
*.log
*.tmp
*.swp

